<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Police, Fire & EMS Alerts for Your Address – Orange County FL | Orlando Call Map</title>
<meta name="description" content="Get a text or email when police, fire or rescue is dispatched near your home, business or school in Orange County, Florida. Choose your radius. $10/month, cancel anytime.">
<link rel="canonical" href="/alerts">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="form-page" data-tiles="" data-attr="">
<header class="topbar">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="11" fill="#F28C28"/><path d="M16 6c2-3 6-4 8-3-1 3-4 5-8 3z" fill="#57C08B"/><circle cx="16" cy="17" r="4" fill="#0F2C3F"/></svg>Orlando Call Map</a>
  <a class="btn-quiet" href="/" style="margin-left:auto">Back to live map</a>
</header>
<main class="form-wrap">
  <form id="f" novalidate>
    <h1>Alerts for your address</h1>
    <p class="lede">When police, fire, rescue or a crash response is dispatched inside your radius, we'll text or email you. Covers Orlando and all of Orange County.</p>
    <p class="price">$10 <span>per month, cancel anytime</span></p>

    <label class="field"><span>Address to watch</span>
      <div class="row"><input type="text" id="address" autocomplete="street-address" placeholder="123 Main St, Orlando" required>
      <button type="button" class="btn-quiet" id="find">Show on map</button></div>
      <small>Home, work, a parent's house or your kid's school. You can add up to 3 places after signing up.</small>
    </label>
    <label class="field"><span>Name this place</span>
      <input type="text" id="label" maxlength="30" placeholder="Home"></label>
    <label class="field"><span>Radius: <output id="rout">1</output> mi</span>
      <input type="range" id="radius" min="0.25" max="10" step="0.25" value="1"></label>

    <fieldset><legend>Alert me about</legend>
      <div class="checks">
        <label><input type="checkbox" name="cat" value="police" checked> Police</label>
        <label><input type="checkbox" name="cat" value="fire" checked> Fire</label>
        <label><input type="checkbox" name="cat" value="medical" checked> Medical</label>
        <label><input type="checkbox" name="cat" value="traffic" checked> Traffic</label>
      </div></fieldset>

    <label class="field"><span>Email</span><input type="email" id="email" autocomplete="email" required></label>
    <label class="field"><span>Mobile number for texts (optional)</span><input type="tel" id="phone" autocomplete="tel" placeholder="(407) 555-0123">
      <small>Leave blank to get email only. Message and data rates may apply. Reply STOP to opt out.</small></label>

    <label class="check"><input type="checkbox" id="agree"> <span>I understand alerts can be delayed by several minutes, locations are approximate, and this is not a substitute for 9-1-1. I agree to the <a href="/terms">Terms</a>.</span></label>
    <p class="msg" id="msg" role="status"></p>
    <button class="cta" type="submit" id="go">Continue to payment</button>
  </form>
  <div id="mini-map" aria-label="Preview of your alert area"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/zone-map.js"></script>
<script src="/subscribe.js"></script>
</body>
</html>
